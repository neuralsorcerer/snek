<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <script src="https://unpkg.com/htmx.org@1.6.1/dist/htmx.min.js"></script>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #000;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(20, 20px);
        grid-template-rows: repeat(20, 20px);
        gap: 1px;
      }
      .cell {
        width: 20px;
        height: 20px;
        background-color: #222;
      }
      .snake {
        background-color: #0f0;
      }
      .food {
        background-color: #f00;
      }
      #score {
        color: #fff;
        font-size: 24px;
        margin-bottom: 10px;
        text-align: center;
      }
      button {
        padding: 6px 12px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div
      id="score"
      hx-get="/score"
      hx-trigger="load, every 500ms"
      hx-swap="innerHTML"
    >
      Score: 0
    </div>
    <button
      id="reset"
      hx-post="/reset"
      hx-target=".grid"
      hx-swap="innerHTML"
      style="margin-bottom: 10px"
    >
      Reset
    </button>
    <div
      class="grid"
      hx-get="/move"
      hx-trigger="load, every 500ms"
      hx-swap="innerHTML"
    ></div>

    <script>
      document.addEventListener("keydown", function (event) {
        let direction = "";
        switch (event.key) {
          case "ArrowUp":
          case "w":
            direction = "up";
            break;
          case "ArrowDown":
          case "s":
            direction = "down";
            break;
          case "ArrowLeft":
          case "a":
            direction = "left";
            break;
          case "ArrowRight":
          case "d":
            direction = "right";
            break;
          case "r":
            htmx.ajax("POST", "/reset", { target: ".grid" });
            return;
        }
        if (direction) {
          htmx.ajax("GET", "/move?direction=" + direction, { target: ".grid" });
        }
      });
    </script>
  </body>
</html>
